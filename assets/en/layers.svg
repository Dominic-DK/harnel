<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 682" width="1200" height="682" role="img" aria-label="The seven layers of Harnel: user entry, central gateway, model gateway, observability, supervisor, agent host, knowledge wiki" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Segoe UI', sans-serif"><defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24,0 H0 V24" fill="none" stroke="#a9c8ff" stroke-opacity="0.06" stroke-width="1"/></pattern><marker id="ar" viewBox="0 0 8 8" refX="7" refY="4" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="#5a7fa8"/></marker><marker id="arh" viewBox="0 0 8 8" refX="7" refY="4" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="#ffb23f"/></marker></defs><rect width="1200" height="682" rx="18" fill="#081b31"/><rect width="1200" height="682" rx="18" fill="url(#grid)"/><rect x="30" y="24" width="1140" height="132" rx="16" fill="#122d4e" stroke="#355a8e"/><text x="48" y="46" font-size="12" font-weight="800" fill="#72aaff" letter-spacing="0.5">User side</text><rect x="30" y="186" width="1140" height="262" rx="16" fill="#162c4e" stroke="#50548e"/><text x="48" y="208" font-size="12" font-weight="800" fill="#b79bff" letter-spacing="0.5">Central server</text><rect x="30" y="474" width="1140" height="184" rx="16" fill="#10304a" stroke="#266e74"/><text x="1152" y="496" text-anchor="end" font-size="12" font-weight="800" fill="#4ddcbd" letter-spacing="0.5">Execution machines · cloud VMs and on-premises servers</text><path d="M60,214 H1150 V356 H1126" fill="none" stroke="#ff7fc2" stroke-width="1.8" stroke-dasharray="3 5"/><path d="M60,424 H1150 V356" fill="none" stroke="#ff7fc2" stroke-width="1.8" stroke-dasharray="3 5"/><path d="M200,134 V238" fill="none" stroke="#ffb23f" stroke-width="2" marker-end="url(#arh)" marker-start="url(#arh)"/><path d="M200,512 V382" fill="none" stroke="#ffb23f" stroke-width="2" marker-end="url(#arh)" marker-start="url(#arh)"/><path d="M540,512 V268 H566" fill="none" stroke="#ffb23f" stroke-width="2" marker-end="url(#arh)"/><path d="M344,568 H376" fill="none" stroke="#ffb23f" stroke-width="2" marker-end="url(#arh)"/><path d="M764,568 H796" fill="none" stroke="#ffb23f" stroke-width="2" marker-end="url(#arh)"/><path d="M806,268 H836" fill="none" stroke="#ffb23f" stroke-width="2" marker-end="url(#arh)"/><path d="M920,238 V132" fill="none" stroke="#ffb23f" stroke-width="2" marker-end="url(#arh)"/><circle cx="200" cy="214" r="5" fill="#ff7fc2"/><circle cx="200" cy="424" r="5" fill="#ff7fc2"/><circle cx="540" cy="424" r="5" fill="#ff7fc2"/><rect x="60" y="50" width="460" height="84" rx="12" fill="#0c2543" stroke="#72aaff" stroke-width="1.6"/><circle cx="86" cy="77" r="14" fill="#72aaff"/><text x="86" y="82.5" text-anchor="middle" font-size="15" font-weight="800" fill="#081b31">1</text><text x="110" y="83" font-size="16.5" font-weight="800" fill="#e9f1fc">User entry</text><text x="76" y="108" font-size="12.5" fill="#9db5d0">Desktop app and messenger. Requests, approvals, results.</text><text x="76" y="126" font-size="12.5" fill="#9db5d0">File operations on a user's PC run on that PC.</text><rect x="840" y="62" width="160" height="70" rx="12" fill="#0c2543" stroke="#94a7ba" stroke-width="1.6" stroke-dasharray="6 4"/><text x="856" y="95" font-size="16.5" font-weight="800" fill="#e9f1fc">Model API</text><text x="856" y="120" font-size="12.5" fill="#9db5d0">External provider</text><rect x="60" y="238" width="460" height="144" rx="12" fill="#0c2543" stroke="#b79bff" stroke-width="1.6"/><circle cx="86" cy="265" r="14" fill="#b79bff"/><text x="86" y="270.5" text-anchor="middle" font-size="15" font-weight="800" fill="#081b31">2</text><text x="110" y="271" font-size="16.5" font-weight="800" fill="#e9f1fc">Central gateway</text><text x="76" y="296" font-size="12.5" fill="#9db5d0">Authenticates users and records tasks in the ledger.</text><rect x="76" y="312" width="134" height="24" rx="6" fill="#273861" stroke="#6260a1"/><text x="143" y="328.5" text-anchor="middle" font-size="12" font-weight="600" fill="#e9f1fc">Task ledger</text><rect x="222" y="312" width="134" height="24" rx="6" fill="#273861" stroke="#6260a1"/><text x="289" y="328.5" text-anchor="middle" font-size="12" font-weight="600" fill="#e9f1fc">Host registry</text><rect x="368" y="312" width="134" height="24" rx="6" fill="#273861" stroke="#6260a1"/><text x="435" y="328.5" text-anchor="middle" font-size="12" font-weight="600" fill="#e9f1fc">Delegation token</text><rect x="76" y="342" width="134" height="24" rx="6" fill="#273861" stroke="#6260a1"/><text x="143" y="358.5" text-anchor="middle" font-size="12" font-weight="600" fill="#e9f1fc">Trigger</text><rect x="222" y="342" width="134" height="24" rx="6" fill="#273861" stroke="#6260a1"/><text x="289" y="358.5" text-anchor="middle" font-size="12" font-weight="600" fill="#e9f1fc">Approval queue</text><rect x="368" y="342" width="134" height="24" rx="6" fill="#273861" stroke="#6260a1"/><text x="435" y="358.5" text-anchor="middle" font-size="12" font-weight="600" fill="#e9f1fc">Policy registry</text><rect x="566" y="238" width="240" height="84" rx="12" fill="#0c2543" stroke="#b79bff" stroke-width="1.6"/><circle cx="592" cy="265" r="14" fill="#b79bff"/><text x="592" y="270.5" text-anchor="middle" font-size="15" font-weight="800" fill="#081b31">3</text><text x="616" y="271" font-size="16.5" font-weight="800" fill="#e9f1fc">Model gateway</text><text x="582" y="296" font-size="12.5" fill="#9db5d0">Account keys stay on this server.</text><text x="582" y="314" font-size="12.5" fill="#9db5d0">Agents use short-lived keys.</text><rect x="836" y="238" width="164" height="60" rx="12" fill="#0c2543" stroke="#b79bff" stroke-width="1.6"/><text x="852" y="271" font-size="16.5" font-weight="800" fill="#e9f1fc">Account pool</text><rect x="836" y="326" width="290" height="60" rx="12" fill="#0c2543" stroke="#ff7fc2" stroke-width="1.6"/><circle cx="862" cy="353" r="14" fill="#ff7fc2"/><text x="862" y="358.5" text-anchor="middle" font-size="15" font-weight="800" fill="#081b31">4</text><text x="886" y="359" font-size="16.5" font-weight="800" fill="#e9f1fc">Observability</text><text x="1018" y="352" font-size="12.5" fill="#9db5d0">Records every</text><text x="1018" y="370" font-size="12.5" fill="#9db5d0">gateway request.</text><rect x="60" y="512" width="284" height="112" rx="12" fill="#0c2543" stroke="#4ddcbd" stroke-width="1.6"/><circle cx="86" cy="539" r="14" fill="#4ddcbd"/><text x="86" y="544.5" text-anchor="middle" font-size="15" font-weight="800" fill="#081b31">5</text><text x="110" y="545" font-size="16.5" font-weight="800" fill="#e9f1fc">Supervisor</text><text x="76" y="570" font-size="12.5" fill="#9db5d0">One always-on process per machine.</text><text x="76" y="588" font-size="12.5" fill="#9db5d0">No model access, no account keys.</text><text x="76" y="606" font-size="12.5" fill="#9db5d0">Outbound connections only.</text><rect x="376" y="512" width="388" height="112" rx="12" fill="#0c2543" stroke="#4ddcbd" stroke-width="1.6"/><circle cx="402" cy="539" r="14" fill="#4ddcbd"/><text x="402" y="544.5" text-anchor="middle" font-size="15" font-weight="800" fill="#081b31">6</text><text x="426" y="545" font-size="16.5" font-weight="800" fill="#e9f1fc">Agent host</text><text x="392" y="570" font-size="12.5" fill="#9db5d0">Isolated container. No internet, no account keys.</text><text x="392" y="588" font-size="12.5" fill="#9db5d0">Requests outside the allowlist are rejected.</text><text x="392" y="606" font-size="12.5" fill="#9db5d0">File changes apply after user approval.</text><rect x="796" y="512" width="344" height="112" rx="12" fill="#0c2543" stroke="#4ddcbd" stroke-width="1.6"/><circle cx="822" cy="539" r="14" fill="#4ddcbd"/><text x="822" y="544.5" text-anchor="middle" font-size="15" font-weight="800" fill="#081b31">7</text><text x="846" y="545" font-size="16.5" font-weight="800" fill="#e9f1fc">Knowledge wiki</text><text x="812" y="570" font-size="12.5" fill="#9db5d0">Decisions, rules, and work records.</text><text x="812" y="588" font-size="12.5" fill="#9db5d0">People and agents read the same documents.</text><text x="812" y="606" font-size="12.5" fill="#9db5d0">Mandatory rules are enforced by hooks.</text><text x="212" y="176" text-anchor="start" font-size="12" font-weight="700" fill="#ffb23f" stroke="#081b31" stroke-width="4" stroke-linejoin="round" paint-order="stroke">Requests · tool calls · approvals</text><text x="212" y="462" text-anchor="start" font-size="12" font-weight="700" fill="#ffb23f" stroke="#081b31" stroke-width="4" stroke-linejoin="round" paint-order="stroke">Fetch tasks · report results (outbound connection)</text><text x="552" y="462" text-anchor="start" font-size="12" font-weight="700" fill="#ffb23f" stroke="#081b31" stroke-width="4" stroke-linejoin="round" paint-order="stroke">Model call with short-lived key</text><text x="360" y="646" text-anchor="middle" font-size="12" font-weight="700" fill="#ffb23f" stroke="#081b31" stroke-width="4" stroke-linejoin="round" paint-order="stroke">Start · pass task</text><text x="780" y="646" text-anchor="middle" font-size="12" font-weight="700" fill="#ffb23f" stroke="#081b31" stroke-width="4" stroke-linejoin="round" paint-order="stroke">Read rules · report</text><text x="932" y="176" text-anchor="start" font-size="12" font-weight="700" fill="#ffb23f" stroke="#081b31" stroke-width="4" stroke-linejoin="round" paint-order="stroke">Inject account token</text><text x="1138" y="206" text-anchor="end" font-size="10.5" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#ff7fc2">Observability tap</text><text x="1138" y="441" text-anchor="end" font-size="10.5" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#ff7fc2">Observability tap</text></svg>
